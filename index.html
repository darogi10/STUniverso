<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♥️ Shirly Tarrifa ♥️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #05050e;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
        }

        .overlay-content {
            position: relative;
            z-index: 2;
            min-height: 480vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        .card-header {
            margin-top: 50px;
            background: rgba(15, 15, 35, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 105, 180, 0.5);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 0 30px rgba(233, 30, 99, 0.5);
        }

        .card-header h1 {
            font-size: 1.8rem;
            color: #ff69b4;
            margin-bottom: 10px;
            text-shadow: 0 0 12px #ff1493;
        }

        .card-header p {
            font-size: 1rem;
            color: #e0e0e0;
            line-height: 1.5;
        }

        .scroll-hint {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #aaa;
            animation: bounce 2s infinite;
        }

        /* --- BOTÓN DE MÚSICA FLOTANTE --- */
        .music-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(255, 20, 147, 0.3);
            border: 1px solid #ff69b4;
            color: #fff;
            padding: 10px 18px;
            border-radius: 25px;
            backdrop-filter: blur(8px);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.4);
            transition: all 0.3s ease;
        }

        .music-btn:hover {
            background: rgba(255, 20, 147, 0.6);
            transform: scale(1.05);
        }

        /* Contenedor de YouTube fuera de la pantalla en lugar de display:none */
        #youtube-player-container {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
    </style>
    <!-- Cargar la API de YouTube -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- Contenedor invisible para YouTube -->
    <div id="youtube-player-container">
        <div id="youtube-player"></div>
    </div>

    <!-- BOTÓN PARA CONTROLAR LA MÚSICA -->
    <button class="music-btn" id="musicBtn">🎵 Reproducir Música</button>

    <div id="canvas-container"></div>

    <div class="overlay-content">
        <div class="card-header">
            <h1>✨ Shirly Tarrifa ✨</h1>
            <p><strong>Princesa 👑</strong>, cada palabra describe la gran mujer que eres! Gracias por existir y hacer todo brillante.</p>
        </div>
        <div class="scroll-hint">Desliza hacia abajo para descubrir lo que hay en tu corazón ✨👇</div>
    </div>

    <script>
        // --- CONTROL DE MÚSICA CON YOUTUBE ---
        let player;
        let isPlaying = false;
        const musicBtn = document.getElementById('musicBtn');

        // ID del video de YouTube (SÓLO el código de 11 caracteres)
        const YOUTUBE_VIDEO_ID = 'dqLOUE8vGlk'; 

        // Esta función se ejecuta automáticamente cuando la API de YouTube carga
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtube-player', {
                height: '200',
                width: '200',
                videoId: YOUTUBE_VIDEO_ID,
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'loop': 1,
                    'playlist': YOUTUBE_VIDEO_ID
                }
            });
        }

        function toggleMusic() {
            if (!player || typeof player.getPlayerState !== 'function') return;

            const state = player.getPlayerState();
            
            if (state === 1) { // 1 = Reproduciendo
                player.pauseVideo();
                musicBtn.textContent = '🎵 Reproducir Música';
                isPlaying = false;
            } else {
                player.playVideo();
                musicBtn.textContent = '⏸️ Pausar Música';
                isPlaying = true;
            }
        }

        musicBtn.addEventListener('click', toggleMusic);

        // Intenta reproducir al primer toque o clic en la pantalla
        window.addEventListener('click', () => {
            if (!isPlaying && player && typeof player.getPlayerState === 'function') {
                const state = player.getPlayerState();
                if (state !== 1) {
                    toggleMusic();
                }
            }
        }, { once: true });


        // --- CONFIGURACIÓN DE THREE.JS ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05050e, 0.0009);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.z = 400;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        function createTextureSprite(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#ff1493';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            if (type === 'sparkle') {
                ctx.font = '50px Arial';
                ctx.fillText('✨', 32, 32);
            } else if (type === 'heart') {
                ctx.font = '50px Arial';
                ctx.fillText('❤️', 32, 32);
            }
            
            return new THREE.CanvasTexture(canvas);
        }
        
        const sparkleTexture = createTextureSprite('sparkle');
        const heartTexture = createTextureSprite('heart');

        const sparkleGeometry = new THREE.BufferGeometry();
        const heartGeometry = new THREE.BufferGeometry();
        const starsCount = 4000;
        const sparklePositions = [];
        const heartPositions = [];

        for (let i = 0; i < starsCount; i++) {
            const x = (Math.random() - 0.5) * 1800;
            const y = (Math.random() - 0.5) * 3200;
            const z = (Math.random() - 0.5) * 1800;
            
            if (Math.random() > 0.5) {
                sparklePositions.push(x, y, z);
            } else {
                heartPositions.push(x, y, z);
            }
        }

        sparkleGeometry.setAttribute('position', new THREE.Float32BufferAttribute(sparklePositions, 3));
        heartGeometry.setAttribute('position', new THREE.Float32BufferAttribute(heartPositions, 3));

        const sparkleMaterial = new THREE.PointsMaterial({
            size: 15,
            map: sparkleTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });
        
        const heartMaterial = new THREE.PointsMaterial({
            size: 12,
            map: heartTexture,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const sparkles = new THREE.Points(sparkleGeometry, sparkleMaterial);
        const heartsPart = new THREE.Points(heartGeometry, heartMaterial);
        
        const starField = new THREE.Group();
        starField.add(sparkles);
        starField.add(heartsPart);
        scene.add(starField);

        const phrases = [
            "✨ Shirly Tarrifa ✨", 
            "❤️ Shirly Tarrifa ❤️", 
            "👑 Shirly, mi todo 👑",
            "Fascinante 🤩", "Radiante ☀️", "Mágica 🪄", "Sublime 🌌", "Inolvidable 💖",
            "Especial 💎", "Luminosa 💡", "Angelical 👼", "Cautivadora 🧲", "Única 🦄",
            "Genuina 🌿", "Inigualable 🏆", "Resplandeciente 🌟", "Magnética ⚡", "Irresistible 🔥",
            "Maravillosa 🎨", "Divina 🕊️", "Majestuosa 👑", "Extraordinaria 🚀", "Eterna ♾️",
            "Adorada 🥰", "Encantadora ✨", "Cálida ☀️", "Apasionada ❤️‍🔥", "Dulzura 🍯",
            "Deseada 💘", "Apasionante 💃", "Incondicional 🛡️", "Tierna 🧸", "Amada 💕",
            "Inspiradora 🌈", "Envolvedora 🫂", "Romántica 🌹", "Vital 💓", "Refugio 🏡",
            "Bondadosa 🤲", "Apoyo 🤝", "Cómplice 🤫", "Sincera 💎", "Valiosa 🪙",
            "Hermosa 🌸", "Esbelta 🦢", "Elegante 👠", "Preciosa 💍", "Armoniosa 🎶",
            "Coqueta 😉", "Estilizada ✨", "Guapa 😍", "Pura 💧", "Delicada 🪶",
            "Seductora 💋", "Atractiva 🧲", "Bella 🌺", "Sensual 🕯️", "Agraciada 💃",
            "Fina 🍷", "Deslumbrante 🎇", "Linda 🦋", "Perfecta 👌", "Escultural 🏛️",
            "Inteligente 🧠", "Valiente 🦁", "Audaz 🦅", "Brillante 💡", "Fuerte 🛡️",
            "Sabia 🦉", "Resiliente 🪴", "Auténtica 💯", "Decidida 🎯", "Perspicaz 👁️",
            "Soñadora 💭", "Perseverante 🏔️", "Empática 🫶", "Madura 🌳", "Talentosa 🎭",
            "Persistente ⏳", "Líder 👑", "Espirituosa 💫", "Misteriosa 🌙", "Profunda 🌊",
            "Enigmática 🔮", "Mística 🌌", "Poética 📜", "Inalcanzable ⭐️", "Infinita 🌌",
            "Apacible 🍃", "Intensa ❤️‍🔥", "Serena 🧘‍♀️", "Espiritual 🕯️", "Divertida 🥳",
            "Ocurrente 💡", "Alegre 😄", "Carismática ✨", "Compañera 🤝", "Tesoro 💎",
            "Bendición 🙏", "Mi Todo ❤️"
        ];

        const textGroup = new THREE.Group();
        scene.add(textGroup);

        function createTextSprite(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 128;

            const isName = text.includes("Shirly Tarrifa") || text.includes("Shirly");

            ctx.font = isName ? 'Bold 34px "Segoe UI", Arial, sans-serif' : 'Bold 26px "Segoe UI", Arial, sans-serif';
            ctx.fillStyle = isName ? '#ffd700' : (Math.random() > 0.4 ? '#00ffff' : '#ff69b4');
            ctx.shadowColor = isName ? '#ff0000' : '#ff007f';
            ctx.shadowBlur = isName ? 20 : 12;
            ctx.textAlign = 'center';
            ctx.fillText(text, 256, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.scale.set(isName ? 165 : 130, isName ? 42 : 32, 1);
            return sprite;
        }

        phrases.forEach((phrase, index) => {
            const sprite = createTextSprite(phrase);
            const yPos = (index / phrases.length) * -2600 + 300; 
            sprite.position.set(
                (Math.random() - 0.5) * 850,
                yPos + (Math.random() - 0.5) * 100,
                (Math.random() - 0.5) * 850
            );
            textGroup.add(sprite);
        });

        const heartShape = new THREE.Shape();
        const x = 0, y = 0;
        heartShape.moveTo(x + 5, y + 5);
        heartShape.bezierCurveTo(x + 5, y + 5, x + 4, y, x, y);
        heartShape.bezierCurveTo(x - 6, y, x - 6, y + 7, x - 6, y + 7);
        heartShape.bezierCurveTo(x - 6, y + 11, x - 3, y + 15.4, x + 5, y + 19);
        heartShape.bezierCurveTo(x + 13, y + 15.4, x + 16, y + 11, x + 16, y + 7);
        heartShape.bezierCurveTo(x + 16, y + 7, x + 16, y, x + 10, y);
        heartShape.bezierCurveTo(x + 7, y, x + 5, y + 5, x + 5, y + 5);

        const extrudeSettings = { depth: 2, bevelEnabled: true, bevelSegments: 3, steps: 2, bevelSize: 1, bevelThickness: 1 };
        const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
        const material = new THREE.MeshBasicMaterial({ color: 0xff007f, wireframe: true });
        const heartMesh = new THREE.Mesh(geometry, material);
        heartMesh.scale.set(5, -5, 5);
        heartMesh.position.set(-20, 20, 0);
        scene.add(heartMesh);

        let scrollY = 0;
        window.addEventListener('scroll', () => {
            scrollY = window.scrollY;
        });

        function animate() {
            requestAnimationFrame(animate);
            starField.rotation.y += 0.0008;
            textGroup.rotation.y += 0.0012;
            heartMesh.rotation.y += 0.01;
            camera.position.y = -scrollY * 0.45;
            camera.position.z = 400 + scrollY * 0.12;
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
